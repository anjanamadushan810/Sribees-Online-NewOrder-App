name: sribees_new_orders
description: "Sribees New Orders - branch order management for Sribees Online staff."
publish_to: 'none'

# NAME+CODE. The APK, the Settings screen and this line must always agree
# (scripts/verify_build_version.sh checks it on every CI build). Never pass
# --build-name / --build-number to flutter build; change this line instead.
version: 0.6.0+6

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  intl: any
  google_fonts: ^6.2.1
  package_info_plus: ^8.1.0
  url_launcher: ^6.3.1
  # New-order alerts (same versions as the customer app).
  firebase_core: 4.14.0
  firebase_messaging: 16.7.0
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
